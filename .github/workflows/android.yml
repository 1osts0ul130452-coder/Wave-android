name: Build WAVE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip WAVE-Android-Source.zip -d extracted
          ls -la extracted

      
      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/WAVE-Android/app/build.gradle.kts")
          s = p.read_text()
          old = "    buildFeatures { compose = true }"
          new = """    compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures { compose = true }"""
          if old not in s:
              raise SystemExit("Не найден блок buildFeatures")
          p.write_text(s.replace(old, new))
          PY

      - name: Build APK
        run: |
          cd extracted/WAVE-Android
          gradle assembleDebug
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-APK
          path: extracted/WAVE-Android/app/build/outputs/apk/debug/app-debug.apk
          
